[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defillet-python"
version = "0.1.0"
description = "Python implementation of DeFillet fillet detection and removal"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "trimesh>=4.0",
  "networkx>=3.0",
]

[project.scripts]
defillet = "defillet_py.cli:main"

[tool.setuptools.packages.find]
where = ["."]
